# Test profile — fast, isolated, no external services.
# Pins the test suite to in-memory H2 and disables Flyway so the Postgres-targeted
# baseline migration never runs against H2. The Postgres/Flyway path is exercised
# separately by FlywayPostgresIntegrationTest (Testcontainers).
spring.application.name=volt

spring.datasource.url=jdbc:h2:mem:voltdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# JWT (deterministic dev secret for tests)
volt.jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3Itdm9sdC1hcHAtZGV2LTIwMjY=
volt.jwt.access-token-expiration-ms=900000
volt.jwt.refresh-token-expiration-ms=604800000

# Storage
volt.storage.upload-dir=build/test-uploads
volt.storage.base-url=http://localhost:8080/uploads

# Google sign-in — decoder bean just needs non-blank config to construct; NimbusJwtDecoder
# resolves the JWKS lazily on first decode(), and tests that exercise it mock JwtDecoder.
volt.google.client-ids=test-client-id
volt.google.issuers=https://accounts.google.com,accounts.google.com
volt.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
