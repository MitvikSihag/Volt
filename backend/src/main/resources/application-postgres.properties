# Production-like profile: PostgreSQL + Flyway migrations + schema validation.
# Activate with `--spring.profiles.active=postgres` (docker-compose sets this).
# Connection details default to a local Postgres but are overridden by env vars
# (and by Testcontainers @ServiceConnection in integration tests).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/volt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:volt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:volt}
spring.datasource.driver-class-name=org.postgresql.Driver

# No fallback is allowed in the PostgreSQL profile. A missing production signing
# key must fail application startup instead of silently using the public dev key.
volt.jwt.secret=${VOLT_JWT_SECRET}

# Hibernate never manages the schema in this profile — Flyway is the single source
# of truth and Hibernate only validates that the entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false
