spring.application.name=volt

# ---------------------------------------------------------------------------
# Default profile = local dev. In-memory H2, schema managed by Hibernate, no
# Flyway. Ephemeral by design (fast iteration, data is wiped on restart). For a
# persistent, production-like stack use the `postgres` profile
# (application-postgres.properties) or `docker compose up`.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:voltdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway is disabled for the H2 dev profile (the baseline migration targets
# PostgreSQL). It is enabled in the `postgres` profile.
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT signing keys — "kid:base64,kid:base64"; every listed key verifies, only the active one signs.
# Rotate: add a new kid, switch active-kid, drop the old kid after the access TTL has passed.
# The committed dev key MUST be overridden via VOLT_JWT_KEYS in any non-local environment.
volt.jwt.keys=${VOLT_JWT_KEYS:dev:dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3Itdm9sdC1hcHAtZGV2LTIwMjY=}
volt.jwt.active-kid=${VOLT_JWT_ACTIVE_KID:dev}
volt.jwt.access-token-expiration-ms=${VOLT_JWT_ACCESS_TTL_MS:900000}
volt.jwt.refresh-token-expiration-ms=${VOLT_JWT_REFRESH_TTL_MS:604800000}

# Google sign-in — accepted ID-token audiences (iOS, Android, Web OAuth client IDs, comma-separated)
volt.google.client-ids=${VOLT_GOOGLE_CLIENT_IDS:}
volt.google.issuers=https://accounts.google.com,accounts.google.com
volt.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Storage (local dev — swap for S3 in production)
volt.storage.upload-dir=${VOLT_STORAGE_UPLOAD_DIR:uploads}
volt.storage.base-url=${VOLT_STORAGE_BASE_URL:http://localhost:8080/uploads}

# Legal — version string recorded on the user at consent time (register / Google sign-up)
volt.legal.terms-version=${VOLT_TERMS_VERSION:2026-09}

# Mail — Resend HTTPS API. Disabled by default: links are logged instead (dev only).
volt.mail.enabled=${VOLT_MAIL_ENABLED:false}
volt.mail.resend-api-key=${VOLT_RESEND_API_KEY:}
volt.mail.from=${VOLT_MAIL_FROM:Volt <noreply@volt.app>}
volt.mail.link-base=${VOLT_MAIL_LINK_BASE:volt://}

# Actuator
management.endpoints.web.exposure.include=health,info

# Security
volt.security.rate-limit-enabled=${VOLT_RATE_LIMIT_ENABLED:true}
volt.security.trust-proxy=${VOLT_TRUST_PROXY:false}
volt.cors.allowed-origins=${VOLT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
