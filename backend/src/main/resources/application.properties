spring.application.name=volt
spring.profiles.active=dev

# H2 in-memory DB (swap for Postgres later)
spring.datasource.url=jdbc:h2:mem:voltdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
# Dev secret — replace with a strong random base64 key in production
volt.jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3Itdm9sdC1hcHAtZGV2LTIwMjY=
volt.jwt.access-token-expiration-ms=900000
volt.jwt.refresh-token-expiration-ms=604800000

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Storage (local dev — swap for S3 in production)
volt.storage.upload-dir=uploads
volt.storage.base-url=http://localhost:8080/uploads

# Actuator
management.endpoints.web.exposure.include=health,info
