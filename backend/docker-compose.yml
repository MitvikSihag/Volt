# Production-like local stack: PostgreSQL + the Volt API.
#   export VOLT_JWT_SECRET="$(openssl rand -base64 48)"
#   docker compose up --build
# The API runs the `postgres` profile (Flyway migrations + schema validation) and
# persists data in named volumes that survive `docker compose down` (use `-v` to wipe).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volt}
      POSTGRES_DB: ${POSTGRES_DB:-volt}
    ports:
      - "5432:5432"
    volumes:
      - volt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volt} -d ${POSTGRES_DB:-volt}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-volt}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-volt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-volt}
      VOLT_JWT_SECRET: ${VOLT_JWT_SECRET:?Set VOLT_JWT_SECRET to a strong base64 key}
      VOLT_GOOGLE_CLIENT_IDS: ${VOLT_GOOGLE_CLIENT_IDS:-}
    ports:
      - "8080:8080"
    volumes:
      - volt-uploads:/app/uploads

volumes:
  volt-pgdata:
  volt-uploads:
