        targetSets:
          type: integer
          format: int32
        targetReps:
          type: integer
          format: int32
        restSeconds:
          type: integer
          format: int32
        notes:
          type: string
    RoutineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: string
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/RoutineExerciseResponse"
        createdAt:
          type: string
          format: date-time
    UpdateExerciseRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 500
          minLength: 0
        primaryMuscleGroup:
          type: string
          enum:
          - CHEST
          - BACK
          - SHOULDERS
          - BICEPS
          - TRICEPS
          - QUADRICEPS
          - HAMSTRINGS
          - GLUTES
          - CALVES
          - CORE
          - FOREARMS
          - FULL_BODY
        secondaryMuscleGroups:
          type: array
          items:
            type: string
            enum:
            - CHEST
            - BACK
            - SHOULDERS
            - BICEPS
            - TRICEPS
            - QUADRICEPS
            - HAMSTRINGS
            - GLUTES
            - CALVES
            - CORE
            - FOREARMS
            - FULL_BODY
          uniqueItems: true
        equipment:
          type: string
          enum:
          - BARBELL
          - DUMBBELL
          - MACHINE
          - CABLE
          - BODYWEIGHT
          - KETTLEBELL
          - RESISTANCE_BAND
          - OTHER
        movementType:
          type: string
          enum:
          - COMPOUND
          - ISOLATION
        measurementType:
          type: string
          enum:
          - REPS_WEIGHT
          - DISTANCE
          - DURATION
          - REPS_ONLY
    ExerciseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        primaryMuscleGroup:
          type: string
          enum:
          - CHEST
          - BACK
          - SHOULDERS
          - BICEPS
          - TRICEPS
          - QUADRICEPS
          - HAMSTRINGS
          - GLUTES
          - CALVES
          - CORE
          - FOREARMS
          - FULL_BODY
        secondaryMuscleGroups:
          type: array
          items:
            type: string
            enum:
            - CHEST
            - BACK
            - SHOULDERS
            - BICEPS
            - TRICEPS
            - QUADRICEPS
            - HAMSTRINGS
            - GLUTES
            - CALVES
            - CORE
            - FOREARMS
            - FULL_BODY
