name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Test/Compose configuration only; never used for deployment.
      VOLT_JWT_SECRET: dGhpcy1pcy1hLWNpLW9ubHktc2VjcmV0LWtleS1mb3Itdm9sdC10ZXN0cw==
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle*

      - name: Build and test backend
        run: ./gradlew clean build

      - name: Verify OpenAPI contract is unchanged
        run: |
          git diff --exit-code -- docs/api/openapi.yaml
          test -z "$(git status --porcelain -- docs/api/openapi.yaml)"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag volt-backend:ci .
