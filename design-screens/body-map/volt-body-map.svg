<svg viewBox="0 0 460 452" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="sans-serif">
  <!-- Volt body map v6. LOCKED ASSET: do not redraw; recolor regions only, by CSS variable.
       The figure is tiled from its muscle regions, subdivided into visible sub-muscles (all
       sub-shapes share the region's color). Left/right halves are REAL duplicated elements
       (mirrors deliberately unrolled - <use> clones break under scoped stylesheets), so any
       geometry edit must be applied to BOTH halves of BOTH views. Regions (10): delts, chest,
       biceps, triceps, forearms, core, lats-traps, glutes-hams, quads, calves. API: set the CSS
       custom property "vol-<region>" (double-dash prefixed, as in the style block below) on the
       svg or any ancestor; unset regions fall back to "vol-none". Neutral zones (head, hands,
       pelvis, knees, feet): "body". -->
  <style>
    .body { fill: var(--body, #1B1D22); }
    .r { stroke: var(--gap, #0E0F12); stroke-width: 1.2; stroke-linejoin: round; }
    .delts       { fill: var(--vol-delts,       var(--vol-none, #23252B)); }
    .chest       { fill: var(--vol-chest,       var(--vol-none, #23252B)); }
    .biceps      { fill: var(--vol-biceps,      var(--vol-none, #23252B)); }
    .triceps     { fill: var(--vol-triceps,     var(--vol-none, #23252B)); }
    .forearms    { fill: var(--vol-forearms,    var(--vol-none, #23252B)); }
    .core        { fill: var(--vol-core,        var(--vol-none, #23252B)); }
    .lats-traps  { fill: var(--vol-lats-traps,  var(--vol-none, #23252B)); }
    .glutes-hams { fill: var(--vol-glutes-hams, var(--vol-none, #23252B)); }
    .quads       { fill: var(--vol-quads,       var(--vol-none, #23252B)); }
    .calves      { fill: var(--vol-calves,      var(--vol-none, #23252B)); }
    .lbl { fill: var(--label, #6A6D74); font-size: 10px; letter-spacing: 0.2em; }
  </style>

